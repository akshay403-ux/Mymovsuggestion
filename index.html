<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art of Movies and Web Series</title>
    <meta name="description" content="A curated list of our top movies and web series suggestions.">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="theme-toggle" class="btn-theme">Change Theme</button>
    <div id="app">
        <!-- Login View -->
        <main id="login-view" class="view active">
            <div class="login-container">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" class="btn-primary" style="margin-top: 1rem; align-self: center;">Login</button>
                </form>
            </div>
        </main>

        <!-- Home View -->
        <main id="home-view" class="view hidden">
            <header class="header-container">
                <div class="title-animation-container">
                    <div class="poster-cycler"></div>
                </div>
                <div class="header-content">
                    <h1 class="main-heading">Art of Movies and Web Series</h1>
                    <p class="subtitle">A curated selection of cinematic experiences</p>
                </div>
            </header>
            
            <h2 class="section-heading">Movies</h2>
            <div class="movie-grid" id="movie-grid">
                <!-- Grid items generated by JS -->
            </div>

            <h2 class="section-heading">Web Series</h2>
            <div class="movie-grid" id="webseries-grid">
                <!-- Grid items generated by JS -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
