<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Movies and Web Series Suggestion</title>
    <meta name="description" content="A curated list of our top movies and web series suggestions.">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Login View -->
        <main id="login-view" class="view active">
            <div class="login-container">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" class="btn-primary" style="margin-top: 1rem; align-self: center;">Login</button>
                </form>
            </div>
        </main>

        <!-- Home View -->
        <main id="home-view" class="view hidden">
            <header>
                <h1 class="main-heading">Our Movies and Web Series Suggestion</h1>
                <p class="subtitle">A curated selection of cinematic experiences</p>
            </header>
            
            <h2 class="section-heading">Movies</h2>
            <div class="movie-grid" id="movie-grid">
                <!-- Grid items generated by JS -->
            </div>

            <h2 class="section-heading">Web Series</h2>
            <div class="movie-grid" id="webseries-grid">
                <!-- Grid items generated by JS -->
            </div>
        </main>

        <!-- Detail View -->
        <section id="detail-view" class="view hidden">
            <div class="detail-wrapper">
                <button id="back-btn" class="btn-back" aria-label="Go back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back to Grid
                </button>
                <div class="detail-container">
                    <div class="poster-container">
                        <img id="detail-poster" src="assets/poster.png" alt="Movie Poster" />
                    </div>
                    <div class="detail-content">
                        <h2 id="detail-title">Movie Name</h2>
                        <div class="rating-wrapper">
                            <span class="rating-label">Rating</span>
                            <div class="rating-container" id="detail-rating" aria-label="Rating">
                                <!-- 10 stars generated by JS -->
                            </div>
                            <span id="detail-rating-value" class="rating-value"></span>
                        </div>
                        <div class="description-container">
                            <p id="detail-description">A short description of the movie will appear here. The user can update this text later.</p>
                        </div>
                        <a id="detail-imdb-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary">
                            View on IMDB
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
